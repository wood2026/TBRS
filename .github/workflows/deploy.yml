name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thy-brain-rotteth-surely
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Phaser AE CLI
        run: npm install --prefix .phaser/ci --no-audit --no-fund @phaser-ae/cli@0.8.0
      - name: Install Phaser AE engine and packs
        env:
          PHASER_AE_TOKEN: ${{ secrets.PHASER_AE_TOKEN }}
        run: node scripts/install-pages-dependencies.mjs
      - name: Build game
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: thy-brain-rotteth-surely/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
